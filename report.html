<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Report an Issue | Civic Echo</title>

<body>

<nav><div class="wrap">
  <a href="index.html" class="brand">Civic Echo</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="reports.html">Reports</a>
    <a href="report.html" class="nav-button">Report an Issue</a>
  </div>
</div></nav>

<main class="form-bg"><div class="wrap" style="width:100%">

  <form class="glass" id="f">
    <h2>Report a Cleanliness Issue</h2>
    <p class="sub">Add a photo and a few details. It goes straight to the authorities.</p>

    <label for="t">Issue Title</label>
    <input id="t" required>

    <div class="row">
      <div>
        <label for="c">Category</label>
        <select id="c" required>
          <option value="">Select a category</option>
          <option>Garbage</option>
          <option>Littering</option>
          <option>Graffiti</option>
          <option>Potholes</option>
          <option>Blocked Drain</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="l">Location</label>
        <input id="l" required>
      </div>
    </div>

    <label for="d">Description</label>
    <textarea id="d" rows="4" required></textarea>

    <label for="i">Upload Image</label>
    <input type="file" id="i" accept="image/*">

    <button class="btn btn-primary" type="submit">Submit Issue</button>
    <div id="msg">Thank you! Your report has been submitted.</div>
    <a href="index.html" class="back">← Back to Home</a>
  </form>
</div></main>
